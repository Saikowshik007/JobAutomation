[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "application-orchestrator"
version = "0.1.0"
description = "Session orchestration and Firestore persistence for job application workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-firestore>=2.21.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
jobautomation-telegram-webhook = "application_orchestrator.telegram_webhook_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
