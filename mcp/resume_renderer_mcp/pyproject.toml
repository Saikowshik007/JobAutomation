[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-renderer-mcp"
version = "0.1.0"
description = "Lightweight MCP server for rendering resume artifacts from TeX source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0.0",
  "reportlab>=5.0.0",
]

[project.scripts]
resume-renderer-mcp = "resume_renderer_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
