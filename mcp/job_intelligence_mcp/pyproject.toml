[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-intelligence-mcp"
version = "0.1.0"
description = "Lightweight MCP server for parsing job descriptions from URLs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "mcp>=1.12.0",
  "playwright>=1.54.0",
]

[project.scripts]
job-intelligence-mcp = "job_intelligence_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
